<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brinkenberg — Creative Studio</title>
<meta name="description" content="Websites die klanten opleveren. Ontworpen om te converteren, met branding, fotografie en video. Voor merken in Nederland, Europa en de VS.">
<meta property="og:title" content="Brinkenberg — Websites die klanten opleveren">
<meta property="og:description" content="Websites die klanten opleveren. Ontworpen om te converteren, met branding, fotografie en video. Voor merken in Nederland, Europa en de VS.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://brinkenberg.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7;
  --bg-card:#FFFFFF;
  --ink:#141412;
  --ink-soft:#6E6A63;
  --line:#E8E5DF;
  --accent:#C4552D;
  --accent-ink:#A3431F;
  --accent-soft:#F6E7DF;
  --radius:18px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#fff}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1280px;margin:0 auto;
  padding:0 32px;height:68px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.wordmark{
  font-family:var(--font-display);
  font-weight:700;font-size:19px;letter-spacing:-.02em;
  text-decoration:none;color:var(--ink);
  display:flex;align-items:center;gap:10px;
}
.wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.header-right{display:flex;align-items:center;gap:20px}
.lang-switch{
  display:flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;
}
.lang-switch button{
  font-family:var(--font-body);font-size:12.5px;font-weight:600;letter-spacing:.03em;
  padding:6px 13px;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;
  transition:all .18s;
}
.lang-switch button.active{background:var(--ink);color:#fff}
.header-cta{
  font-size:13.5px;font-weight:600;color:#fff;background:var(--accent);
  border:1px solid var(--accent);
  padding:8px 16px;border-radius:100px;
  text-decoration:none;white-space:nowrap;
  transition:all .18s;
}
.header-cta:hover{background:var(--accent-ink);border-color:var(--accent-ink)}

/* ---------- hero ---------- */
.hero{
  max-width:1280px;margin:0 auto;
  padding:110px 32px 72px;
}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(48px,8.5vw,118px);
  font-weight:700;letter-spacing:-.045em;line-height:.97;
  animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
}
.hero h1 .accent{color:var(--accent)}
.hero p{
  margin-top:28px;max-width:580px;
  font-size:clamp(17px,2vw,21px);color:var(--ink-soft);line-height:1.55;
  animation:rise .8s .12s cubic-bezier(.2,.7,.2,1) both;
}
.hero .meta-row{
  margin-top:36px;display:flex;gap:28px;flex-wrap:wrap;
  font-size:13.5px;font-weight:500;color:var(--ink-soft);
  animation:rise .8s .22s cubic-bezier(.2,.7,.2,1) both;
}
.hero .meta-row span{display:flex;align-items:center;gap:9px}
.hero .meta-row .tick{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* ---------- filter bar ---------- */
.filterbar{
  position:sticky;top:68px;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.filterbar-inner{
  max-width:1280px;margin:0 auto;padding:14px 32px;
  display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.filterbar-inner::-webkit-scrollbar{display:none}
.filter-divider{
  width:1px;height:22px;background:var(--line);flex-shrink:0;margin:0 8px;
}
.filter-label{
  font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);white-space:nowrap;margin-right:2px;
}
.chip{
  font-family:var(--font-body);font-size:13.5px;font-weight:500;
  padding:8px 16px;border-radius:100px;white-space:nowrap;
  border:1px solid var(--line);background:var(--bg-card);color:var(--ink-soft);
  cursor:pointer;transition:all .18s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .count{opacity:.55;margin-left:5px;font-size:12px}

/* ---------- grid ---------- */
.grid-wrap{max-width:1280px;margin:0 auto;padding:56px 32px 96px}
.grid{
  display:grid;gap:36px;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
}
.card{
  background:var(--bg-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s, opacity .3s, border-color .35s;
  animation:cardIn .5s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 24px 48px -18px rgba(20,20,18,.16);
  border-color:#DCD8D0;
}
.card.hidden{display:none}

/* browser frame */
.frame{position:relative;background:#EFEDE8;border-bottom:1px solid var(--line)}
.frame-bar{
  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;
  background:#F4F2EE;border-bottom:1px solid var(--line);
}
.frame-bar .dots{display:flex;gap:5px}
.frame-bar .dots i{width:9px;height:9px;border-radius:50%;background:#DDD9D1}
.frame-bar .domain{
  flex:1;text-align:center;
  font-size:11.5px;color:var(--ink-soft);font-weight:500;
  background:#fff;border:1px solid var(--line);border-radius:6px;
  padding:3px 10px;margin:0 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:230px;margin-left:auto;margin-right:auto;
}
.shot{
  position:relative;height:270px;overflow:hidden;background:#EFEDE8;
}
.shot img.thumb{
  position:absolute;top:0;left:0;
  width:100%;height:auto;display:block;
  transition:transform 7s cubic-bezier(.33,0,.2,1);
  will-change:transform;
}
.card:hover .shot img.thumb{transform:translateY(calc(270px - 100%))}
.shot .ph{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(150deg,#F4F2EE,#E9E5DE);
}
.shot .ph .ph-dom{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink)}
.shot .ph .ph-cta{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--accent-ink);background:var(--accent-soft);padding:5px 12px;border-radius:100px}
.shot .live-wrap{
  position:absolute;top:0;left:0;
  width:880px;height:1600px;
  transform-origin:top left;
}
.shot iframe.preview{
  width:880px;height:1600px;border:0;display:block;background:#fff;
  pointer-events:none;
  transition:transform 7s cubic-bezier(.33,0,.2,1);
  will-change:transform;
}
.card:hover .shot iframe.preview{transform:translateY(calc(-1 * var(--scrollDist,0px)))}
.shot .shimmer{
  position:absolute;inset:0;
  background:linear-gradient(100deg,#EFEDE8 40%,#F7F5F1 50%,#EFEDE8 60%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-80% 0}}
.shot .hoverhint{
  position:absolute;right:12px;bottom:12px;
  font-size:10.5px;font-weight:600;letter-spacing:.08em;
  background:rgba(20,20,18,.72);color:#fff;
  padding:5px 11px;border-radius:100px;
  opacity:0;transform:translateY(4px);
  transition:all .25s;
  pointer-events:none;
  backdrop-filter:blur(4px);
}
.card:hover .shot .hoverhint{opacity:1;transform:none}

/* card body */
.card-body{padding:22px 24px 24px}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card h3{
  font-family:var(--font-display);
  font-size:21px;font-weight:600;letter-spacing:-.02em;
}
.badges{display:flex;gap:6px;flex-shrink:0}
.badge{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;
  color:var(--ink-soft);border:1px solid var(--line);
  padding:3px 8px;border-radius:6px;white-space:nowrap;
}
.card .desc{
  margin-top:8px;font-size:14.5px;color:var(--ink-soft);line-height:1.5;
  min-height:44px;
}
.tags{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  color:var(--accent-ink);background:var(--accent-soft);
  padding:4px 10px;border-radius:100px;
}
.tag.tag-web{background:var(--accent);color:#fff}
.card-actions{
  margin-top:20px;display:flex;gap:10px;
}
.btn{
  flex:1;text-align:center;
  font-family:var(--font-body);font-size:13.5px;font-weight:600;
  padding:10px 14px;border-radius:10px;cursor:pointer;
  text-decoration:none;transition:all .18s;
  border:1px solid var(--line);
}
.btn-preview{background:var(--bg);color:var(--ink)}
.btn-preview:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.btn-live{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-live:hover{background:var(--accent-ink);border-color:var(--accent-ink)}

/* empty state */
.empty{
  display:none;text-align:center;padding:80px 0;color:var(--ink-soft);
  font-size:15px;
}

/* ---------- preview modal ---------- */
.modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:4vh 4vw;
  background:rgba(20,20,18,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.modal.open{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-frame{
  width:100%;height:100%;max-width:1400px;
  background:var(--bg-card);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 40px 100px -20px rgba(0,0,0,.5);
  animation:pop .3s cubic-bezier(.2,.7,.2,1);
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-bar{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:#F4F2EE;border-bottom:1px solid var(--line);
}
.modal-bar .domain{
  flex:1;text-align:center;font-size:13px;color:var(--ink-soft);font-weight:500;
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 14px;
  max-width:420px;margin:0 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.modal-bar button,.modal-bar a{
  font-family:var(--font-body);font-size:13px;font-weight:600;
  padding:7px 14px;border-radius:8px;cursor:pointer;text-decoration:none;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  transition:all .18s;white-space:nowrap;
}
.modal-bar a:hover{border-color:var(--accent);color:var(--accent)}
.modal-bar button:hover{border-color:var(--ink)}
.modal-body{flex:1;position:relative;background:#EFEDE8}
.modal-body iframe{width:100%;height:100%;border:0;display:block}
.modal-body.modal-shot{overflow-y:auto;overflow-x:hidden;background:#EFEDE8;text-align:center}
.modal-body.modal-shot img{width:100%;max-width:1100px;margin:0 auto;display:block;height:auto}
.modal-body .blocked{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:40px;color:var(--ink-soft);font-size:15px;
}
.modal-body .blocked a{
  font-weight:600;color:#fff;background:var(--accent);
  padding:11px 22px;border-radius:10px;text-decoration:none;
}

/* ---------- CTA ---------- */
.cta{border-top:1px solid var(--line);background:var(--bg)}
.cta-inner{
  max-width:1280px;margin:0 auto;padding:96px 32px;
  display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start;
}
.cta h2{
  font-family:var(--font-display);
  font-size:clamp(34px,4.4vw,54px);font-weight:700;
  letter-spacing:-.035em;line-height:1.02;
}
.cta h2 .accent{color:var(--accent)}
.cta .cta-sub{
  margin-top:20px;max-width:440px;
  font-size:17px;color:var(--ink-soft);line-height:1.55;
}
.cta .cta-points{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.cta .cta-points span{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-soft);font-weight:500}
.cta .cta-points .tick{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.cta .cta-direct{
  margin-top:28px;font-size:14.5px;color:var(--ink-soft);
}
.cta .cta-direct a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.cta .cta-direct a:hover{border-color:var(--accent);color:var(--accent)}

.cta-form{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:32px;
}
.cta-form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cta-form label{
  display:block;font-size:12px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;
}
.cta-form .field{margin-bottom:16px}
.cta-form input,.cta-form textarea{
  width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;transition:border-color .18s,background .18s;
}
.cta-form input:focus,.cta-form textarea:focus{
  outline:none;border-color:var(--accent);background:#fff;
}
.cta-form textarea{resize:vertical;min-height:118px}
.cta-form button{
  width:100%;font-family:var(--font-body);font-size:15px;font-weight:600;
  padding:14px 20px;border-radius:11px;cursor:pointer;
  background:var(--accent);border:1px solid var(--accent);color:#fff;
  transition:all .18s;
}
.cta-form button:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.cta-form button:disabled{opacity:.6;cursor:default}
.cta-note{margin-top:12px;font-size:12.5px;color:var(--ink-soft);text-align:center}
.form-msg{
  margin-top:16px;padding:13px 16px;border-radius:10px;font-size:14.5px;
  display:none;line-height:1.45;
}
.form-msg.ok{display:block;background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.form-msg.err{display:block;background:#FBE9E7;color:#B3261E}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}

@media(max-width:900px){
  .cta-inner{grid-template-columns:1fr;gap:40px;padding:72px 32px}
}
@media(max-width:640px){
  .cta-inner{padding:56px 20px}
  .cta-form{padding:24px}
  .cta-form .row{grid-template-columns:1fr}
}

/* ---------- footer ---------- */
footer{
  border-top:1px solid var(--line);
  background:var(--ink);color:#B8B4AC;
}
.footer-inner{
  max-width:1280px;margin:0 auto;padding:64px 32px;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;
}
.footer-inner .wordmark{color:#fff;font-size:22px}
.footer-inner .email{
  font-size:15px;font-weight:500;color:#fff;text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:2px;
  transition:border-color .2s;
}
.footer-inner .email:hover{border-color:var(--accent)}
.footer-inner .copy{font-size:13px;width:100%;margin-top:8px;opacity:.6}

@media(max-width:640px){
  .header-inner{padding:0 20px}
  .hero{padding:72px 20px 48px}
  .filterbar-inner{padding:12px 20px}
  .grid-wrap{padding:40px 20px 72px}
  .grid{grid-template-columns:1fr;gap:28px}
  .footer-inner{padding:48px 20px}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="wordmark" href="#"><span class="dot"></span>Brinkenberg</a>
    <div class="header-right">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="nl" class="active">NL</button>
        <button data-lang="en">EN</button>
      </div>
      <a class="header-cta" href="#contact" id="headerCta"></a>
    </div>
  </div>
</header>

<section class="hero">
  <h1 id="heroTitle"></h1>
  <p id="heroSub"></p>
  <div class="meta-row" id="heroMeta"></div>
</section>

<div class="filterbar">
  <div class="filterbar-inner" id="filters"></div>
</div>

<main class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"></div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-frame">
    <div class="modal-bar">
      <button id="modalClose"></button>
      <div class="domain" id="modalDomain"></div>
      <a id="modalOpen" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<section class="cta" id="contact">
  <div class="cta-inner">
    <div>
      <h2 id="ctaTitle"></h2>
      <p class="cta-sub" id="ctaSub"></p>
      <div class="cta-points" id="ctaPoints"></div>
      <p class="cta-direct" id="ctaDirect"></p>
    </div>
    <form class="cta-form" id="contactForm" novalidate>
      <div class="row">
        <div class="field">
          <label for="f-name" id="lbName"></label>
          <input type="text" id="f-name" name="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="f-email" id="lbEmail"></label>
          <input type="email" id="f-email" name="email" required autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label for="f-company" id="lbCompany"></label>
        <input type="text" id="f-company" name="company" autocomplete="organization">
      </div>
      <div class="field">
        <label for="f-message" id="lbMessage"></label>
        <textarea id="f-message" name="message" required></textarea>
      </div>
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="btnSend"></button>
      <p class="cta-note" id="ctaNote"></p>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <a class="wordmark" href="#"><span class="dot"></span>Brinkenberg</a>
    <a class="email" href="mailto:info@brinkenberg.com">info@brinkenberg.com</a>
    <div class="copy" id="footerCopy"></div>
  </div>
</footer>

<script>
/* ============================================================
   PROJECTDATA — projecten hier toevoegen of aanpassen.
   disciplines: "branding" | "photo" | "video" | "web"
   region: "nl" | "eu" | "us"
   sitelang: "nl" | "en" | "multi"   (taal van de website zelf)
   desc: { nl: "...", en: "..." }
   ============================================================ */
const PROJECTS = [
  {
    name:"BodyBoost", url:"https://bodyboostusa.com/",
    desc:{
      nl:"Amerikaans wellness-merk — droge hydromassage en cryo/warmtesystemen voor gyms, spa's en klinieken.",
      en:"US wellness-equipment brand — dry hydro-massage and cryo/heat systems for gyms, spas and clinics."
    },
    disciplines:["branding","photo","web"], region:"us", sitelang:"en"
  },
  {
    name:"Bevage", url:"https://bevage.com/",
    desc:{
      nl:"Premium Amerikaans apparaat dat wijn en sterke drank in minuten laat rijpen — verkocht als luxe productervaring.",
      en:"Premium US device that ages wine and spirits in minutes — sold as a luxury product experience."
    },
    disciplines:["photo"], region:"us", sitelang:"en"
  },
  {
    name:"All4Spas", url:"https://www.all4spas.nl/",
    desc:{
      nl:"Meertalige Europese webshop voor spa-onderdelen — 19 jaar vakkennis, alles op voorraad.",
      en:"Multilingual European webshop for spa parts — 19 years of expertise, everything in stock."
    },
    disciplines:["photo","web"], region:"eu", sitelang:"multi"

  "bodyboostusa.com":"bodyboost","bevage.com":"bevage","all4spas.nl":"all4spas",
  "fonteynspas.com":"fonteyn","happythaihats.com":"happythaihats","modelwinkel.nl":"modelwinkel",

const MODE = {
  bodyboost:"thumb",bevage:"thumb",all4spas:"thumb",fonteyn:"thumb",happythaihats:"thumb",
  modelwinkel:"thumb",passionspas:"thumb",riartistic:"thumb",lorangerie:"thumb",
  flierbouw:"live",unicos:"live",eikensingel:"thumb"
};
/* Volgorde per taal: NL toont eerst het herkenbare Nederlandse MKB-werk,
   EN toont eerst het internationale/Engelstalige werk. */
const ORDER_NL = ["eikensingel","lorangerie","unicos","flierbouw","modelwinkel","riartistic","all4spas","fonteyn","passionspas","happythaihats","bodyboost","bevage"];
const ORDER_EN = ["bodyboost","happythaihats","bevage","passionspas","fonteyn","all4spas","eikensingel","lorangerie","unicos","flierbouw","modelwinkel","riartistic"];
const slugOf = u => SLUGS[domainOf(u)] || "";
const modeOf = u => MODE[slugOf(u)] || "live";
const orderOf = u => { const arr = lang==="en"?ORDER_EN:ORDER_NL; const i=arr.indexOf(slugOf(u)); return i<0?999:i; };

/* ---------- filters ---------- */
function renderFilters(){
  const el = document.getElementById("filters");
  el.innerHTML = "";
  const mkChip = (label,count,isActive,onClick)=>{
    const b=document.createElement("button");
    b.className="chip"+(isActive?" active":"");
    b.innerHTML=label+(count!=null?'<span class="count">'+count+"</span>":"");
    b.onclick=onClick;
    return b;
  };
  /* disciplines */
  el.appendChild(mkChip(t().filterAll, PROJECTS.length, activeDiscipline==="all",
    ()=>{activeDiscipline="all";renderFilters();applyFilter();}));
  ["website","branding","photo","video","web"].forEach(k=>{
    const n = k==="website" ? PROJECTS.length : PROJECTS.filter(p=>p.disciplines.includes(k)).length;
    el.appendChild(mkChip(t().disciplines[k], n, activeDiscipline===k,
      ()=>{activeDiscipline=k;renderFilters();applyFilter();}));
  });
  /* divider + taalfilter */
  const div=document.createElement("div");div.className="filter-divider";el.appendChild(div);
  const lbl=document.createElement("span");lbl.className="filter-label";lbl.textContent=t().filterLangLabel;el.appendChild(lbl);
  el.appendChild(mkChip(t().filterAll, null, activeSitelang==="all",
    ()=>{activeSitelang="all";renderFilters();applyFilter();}));
  ["nl","en","multi"].forEach(k=>{
    const n=PROJECTS.filter(p=>p.sitelang===k).length;
    el.appendChild(mkChip(t().sitelangs[k], n, activeSitelang===k,
      ()=>{activeSitelang=k;renderFilters();applyFilter();}));
  });
}

/* ---------- grid ---------- */
function renderGrid(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const ordered=PROJECTS.slice().sort((a,b)=>orderOf(a.url)-orderOf(b.url));
  ordered.forEach((p,i)=>{
    const card=document.createElement("article");
    card.className="card";
    card.style.animationDelay=(i*0.05)+"s";
    card.dataset.disciplines=p.disciplines.join(",");
    card.dataset.sitelang=p.sitelang;
    const slug=slugOf(p.url);
    const mode=modeOf(p.url);
    let media;
    if(mode==="thumb") media=`<img class="thumb" loading="lazy" alt="Preview ${p.name}" src="thumb-${slug}.jpg">`;
    else if(mode==="live") media=`<div class="live-wrap"><iframe class="preview" loading="lazy" src="${p.url}" title="Preview ${p.name}" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe></div>`;
    else media=`<div class="ph"><span class="ph-dom">${domainOf(p.url)}</span><span class="ph-cta">${t().live} ↗</span></div>`;
    card.innerHTML=`
      <div class="frame">
        <div class="frame-bar">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="domain">${domainOf(p.url)}</span>
        </div>
        <div class="shot">
          <div class="shimmer"></div>
          ${media}
          <span class="hoverhint">${t().scrolling}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-top">
          <h3>${p.name}</h3>
          <span class="badges">
            <span class="badge">${t().regions[p.region]}</span>
            <span class="badge">${t().sitelangs[p.sitelang]}</span>
          </span>
        </div>
        <p class="desc">${p.desc[lang]}</p>
        <div class="tags">${["website"].concat(p.disciplines).map(d=>'<span class="tag'+(d==="website"?" tag-web":"")+'">'+t().disciplines[d]+"</span>").join("")}</div>
        <div class="card-actions">
          <button class="btn btn-preview" data-url="${p.url}" data-mode="${mode}" data-slug="${slug}">${t().preview}</button>
          <a class="btn btn-live" href="${p.url}" target="_blank" rel="noopener">${t().live} ↗</a>
        </div>
      </div>`;
    const mediaEl=card.querySelector("iframe.preview, img.thumb");
    const shimmer=card.querySelector(".shimmer");
    if(mediaEl) mediaEl.addEventListener("load",()=>{ shimmer.style.display="none"; });
    grid.appendChild(card);
  });
  applyFilter();
  fitPreviews();
}

/* schaal de live iframes naar de kaartbreedte en bereken de scroll-afstand voor hover */
function fitPreviews(){
  document.querySelectorAll(".card").forEach(c=>{
    const wrap=c.querySelector(".live-wrap");
    const shot=c.querySelector(".shot");
    if(!wrap||!shot) return;
    const s=shot.clientWidth/880;
    wrap.style.transform="scale("+s+")";
    c.style.setProperty("--scrollDist",(1600 - 270/s)+"px");
  });
}
window.addEventListener("resize",fitPreviews);

function applyFilter(){
  let visible=0;
  document.querySelectorAll(".card").forEach(c=>{
    const list=c.dataset.disciplines.split(",").filter(Boolean);
    const dOK = activeDiscipline==="all" || activeDiscipline==="website" || list.includes(activeDiscipline);
    const lOK = activeSitelang==="all" || c.dataset.sitelang===activeSitelang;
    const show = dOK && lOK;
    c.classList.toggle("hidden",!show);
    if(show) visible++;
  });
  const empty=document.getElementById("empty");
  empty.textContent=t().empty;
  empty.style.display = visible? "none":"block";
}

/* ---------- contactformulier ---------- */
/* Verstuurt naar contact@herbertbleijenberg.com met kopie naar info@brinkenberg.com */
/* Anonieme sleutel i.p.v. het e-mailadres: houdt het adres uit de broncode (minder spam).
   Gekoppeld aan info@brinkenberg.com; contact@herbertbleijenberg.com staat in cc. */
const FORM_TO = "6f095f9b5c1010673643be57d30ac0c5";
const FORM_CC = "contact@herbertbleijenberg.com";

document.getElementById("contactForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const form=e.target, btn=document.getElementById("btnSend"), msg=document.getElementById("formMsg");
  const name=form.name.value.trim(), email=form.email.value.trim(),
        company=form.company.value.trim(), message=form.message.value.trim();
  msg.className="form-msg";
  if(form._honey.value) return;                       /* spam-bot gevangen */
  if(!name||!email||!message||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    msg.textContent=t().fErrValidate; msg.className="form-msg err"; return;
  }
  btn.disabled=true; btn.textContent=t().btnSending;
  try{
    const res=await fetch("https://formsubmit.co/ajax/"+FORM_TO,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        _subject:"Nieuwe aanvraag via brinkenberg.com — "+name,
        _cc:FORM_CC,
        _template:"table",
        _captcha:"false",
        Naam:name, Email:email, Bedrijf:company||"—", Bericht:message,
        Taal:lang.toUpperCase()
      })
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok && (data.success===undefined || data.success==="true" || data.success===true)){
      msg.textContent=t().fOk; msg.className="form-msg ok";
      form.reset();
    }else{ throw new Error("send failed"); }
  }catch(err){
    msg.textContent=t().fErrSend; msg.className="form-msg err";
  }finally{
    btn.disabled=false; btn.textContent=t().btnSend;
  }
});

  if(b.dataset.lang===lang) return;
  lang=b.dataset.lang;
  try{ localStorage.setItem("bb-lang",lang); }catch(err){}
  document.querySelectorAll("#langSwitch button").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang));
  renderChrome(); renderFilters(); renderGrid();
});

/* ---------- modal live preview ---------- */
const modal=document.getElementById("modal"),
      mBody=document.getElementById("modalBody"),
      mDomain=document.getElementById("modalDomain"),
      mOpen=document.getElementById("modalOpen");

document.addEventListener("click",e=>{
  const btn=e.target.closest(".btn-preview");
  if(!btn) return;
  const url=btn.dataset.url, mode=btn.dataset.mode, slug=btn.dataset.slug;
  mDomain.textContent=domainOf(url);
  mOpen.href=url;
  if(mode==="live"){
    /* embeddende sites: toon de echte, scrollbare site */
    mBody.className="modal-body";
    mBody.innerHTML=`<iframe src="${url}" sandbox="allow-scripts allow-same-origin" loading="eager"></iframe>`;
  } else if(mode==="thumb"){
    /* screenshot: volledige scrollbare afbeelding, geen kapot frame */
    mBody.className="modal-body modal-shot";
    mBody.innerHTML=`<img src="preview-${slug}.jpg" alt="Preview">`;
  } else {
    /* placeholder: netjes doorverwijzen naar de live site */
    mBody.className="modal-body modal-ph";
    mBody.innerHTML=`<div class="blocked"><div>${t().blocked}</div><a href="${url}" target="_blank" rel="noopener">${t().blockedBtn} ↗</a></div>`;
  }
  modal.classList.add("open");
  document.body.style.overflow="hidden";
});
function closeModal(){
  modal.classList.remove("open");
  mBody.innerHTML="";
  document.body.style.overflow="";
}
document.getElementById("modalClose").onclick=closeModal;
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- init ---------- */
/* Taalkeuze: 1) ?lang= in de URL, 2) eerdere keuze van de bezoeker,
   3) automatisch op browsertaal — Nederlandstalig krijgt NL, al het overige EN. */
function detectLang(){
  try{
    const q=new URLSearchParams(location.search).get("lang");
    if(q==="en"||q==="nl") return q;
  }catch(e){}
  try{
    const saved=localStorage.getItem("bb-lang");
    if(saved==="en"||saved==="nl") return saved;
  }catch(e){}
  try{
    const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||"nl"];
    for(const l of list){
      const code=(l||"").toLowerCase();
      if(code.startsWith("nl")) return "nl";   /* Nederlands / Vlaams */
      if(code.startsWith("en")) return "en";   /* alle Engelstalige regio's */
    }
    /* geen NL en geen EN in de voorkeuren: internationale bezoeker -> Engels */
    return "en";
  }catch(e){}
  return "nl";
}
lang=detectLang();
try{ document.querySelectorAll("#langSwitch button").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang)); }catch(err){}
renderChrome(); renderFilters(); renderGrid();
